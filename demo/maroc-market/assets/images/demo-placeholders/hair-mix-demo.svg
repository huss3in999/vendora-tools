<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="100%" stop-color="#f2e9df"/>
    </radialGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2734c"/>
      <stop offset="60%" stop-color="#c95a32"/>
      <stop offset="100%" stop-color="#9a3b1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#4a3e3d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  <path d="M 100 450 L 100 200 A 150 150 0 0 1 400 200 L 400 450" fill="none" stroke="#dec8ac" stroke-width="1" opacity="0.3"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="385" rx="130" ry="25" fill="#dec8ac" opacity="0.45"/>

  <!-- Botanical/leaf elements on background -->
  <g fill="#0f3a22" opacity="0.08">
    <path d="M 120 180 Q 80 150 100 110 Q 140 130 120 180 Z"/>
    <path d="M 380 150 Q 420 120 400 80 Q 360 100 380 150 Z"/>
  </g>

  <!-- Terracotta Bowl -->
  <g filter="url(#shadow)">
    <!-- Back Rim Inner Mix (Herbs/Spices) -->
    <path d="M 128 300 C 128 260 372 260 372 300 C 372 315 128 315 128 300 Z" fill="#2d3a1e"/>
    <path d="M 150 295 Q 200 280 270 290 Q 330 280 350 295 Q 280 320 150 295 Z" fill="#8f7a42"/>
    
    <!-- Botanical Details inside bowl -->
    <path d="M 180 290 Q 160 250 190 230 Q 210 260 180 290 Z" fill="#0f3a22" opacity="0.85"/>
    <path d="M 320 285 Q 340 245 310 225 Q 290 255 320 285 Z" fill="#8c8b38" opacity="0.9"/>
    
    <!-- Bowl Body -->
    <path d="M 120 300 C 120 280 380 280 380 300 C 380 360 320 390 250 390 C 180 390 120 360 120 300 Z" fill="url(#terracotta)"/>
    <path d="M 120 300 C 120 315 380 315 380 300" fill="none" stroke="#ff8f66" stroke-width="2" opacity="0.35"/>
    
    <!-- Golden Geometric Pattern Band on Bowl -->
    <path d="M 140 330 Q 250 350 360 330" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.85"/>
    <path d="M 148 340 Q 250 360 352 340" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
