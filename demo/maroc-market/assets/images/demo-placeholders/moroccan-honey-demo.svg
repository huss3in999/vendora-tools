<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef6"/>
      <stop offset="100%" stop-color="#fdf4df"/>
    </radialGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#cc5a01"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#4a3e3d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Honeycomb background pattern -->
  <path d="M 230 40 L 250 30 L 270 40 L 270 60 L 250 70 L 230 60 Z M 270 60 L 290 50 L 310 60 L 310 80 L 290 90 L 270 80 Z M 190 50 L 210 40 L 230 50 L 230 70 L 210 80 L 190 70 Z" fill="none" stroke="#f6dfb3" stroke-width="1.5" opacity="0.6"/>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="405" rx="100" ry="18" fill="#dec8ac" opacity="0.4"/>

  <!-- Honey Jar -->
  <g filter="url(#shadow)">
    <!-- Jar Body (Filled with Honey) -->
    <path d="M 180 230 L 320 230 C 345 230 350 250 350 270 L 350 365 C 350 385 330 395 310 395 L 190 395 C 170 395 150 385 150 365 L 150 270 C 150 250 155 230 180 230 Z" fill="url(#honey)"/>
    
    <!-- Glass Highlights -->
    <path d="M 160 270 L 160 360" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    
    <!-- Jar Neck -->
    <rect x="190" y="200" width="120" height="30" rx="4" fill="#fff" opacity="0.3"/>
    
    <!-- Lid cover (Moroccan style fabric and rope) -->
    <path d="M 170 200 Q 250 180 330 200 L 340 215 L 160 215 Z" fill="#b6905d"/>
    <rect x="180" y="212" width="140" height="6" rx="2" fill="#8a6c3f"/>

    <!-- Premium Label -->
    <rect x="190" y="270" width="120" height="70" rx="6" fill="url(#gold)"/>
    <rect x="195" y="275" width="110" height="60" rx="3" fill="#8a3f12"/>
    
    <!-- Dipper leaning on jar -->
    <g transform="rotate(25, 250, 250)">
      <!-- Stick -->
      <rect x="295" y="50" width="10" height="200" rx="3" fill="#d7b47b"/>
      <!-- Dipper head -->
      <rect x="280" y="210" width="40" height="45" rx="5" fill="#cda87e"/>
      <line x1="275" y1="220" x2="325" y2="220" stroke="#b6905d" stroke-width="4"/>
      <line x1="275" y1="230" x2="325" y2="230" stroke="#b6905d" stroke-width="4"/>
      <line x1="275" y1="240" x2="325" y2="240" stroke="#b6905d" stroke-width="4"/>
      <!-- Dripping honey -->
      <path d="M 280 240 Q 290 280 300 270 Q 315 285 315 250 Z" fill="#ffb703"/>
    </g>
  </g>
</svg>
