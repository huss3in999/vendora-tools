<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffcf9"/>
      <stop offset="100%" stop-color="#f5ebe0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="70%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#d45100"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4a3e3d" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Decorative Arch Outline -->
  <path d="M 100 450 L 100 200 A 150 150 0 0 1 400 200 L 400 450" fill="none" stroke="#e3d5ca" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Ground Shadow for Bottle -->
  <ellipse cx="250" cy="410" rx="90" ry="18" fill="#dec8ac" opacity="0.4"/>
  
  <!-- Argan Nuts at the bottom -->
  <g transform="translate(180, 390)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="35" ry="22" fill="#cda87e" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="30" ry="18" fill="#b6905d" transform="rotate(-15)"/>
    <ellipse cx="-10" cy="-5" rx="10" ry="5" fill="#f5ebe0" opacity="0.3"/>
  </g>
  <g transform="translate(310, 395)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#b6905d" transform="rotate(25)"/>
    <ellipse cx="0" cy="0" rx="34" ry="20" fill="#8a6c3f" transform="rotate(25)"/>
    <ellipse cx="-12" cy="-6" rx="12" ry="6" fill="#f5ebe0" opacity="0.25"/>
  </g>
  
  <!-- Argan Leaves -->
  <path d="M 140 400 Q 110 380 140 350 Q 170 380 140 400" fill="#0f3a22" opacity="0.15"/>
  <path d="M 350 380 Q 380 360 350 330 Q 320 360 350 380" fill="#0f3a22" opacity="0.15"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Dropper Top -->
    <path d="M 235 150 L 265 150 L 260 110 L 240 110 Z" fill="#eae2b7"/>
    <rect x="230" y="150" width="40" height="15" rx="3" fill="url(#gold)"/>
    
    <!-- Bottle Neck -->
    <rect x="238" y="165" width="24" height="20" fill="#fff" opacity="0.5"/>
    
    <!-- Bottle Body (Glass) -->
    <path d="M 200 200 C 200 185 215 185 225 185 L 275 185 C 285 185 300 185 300 200 L 300 370 C 300 385 285 400 270 400 L 230 400 C 215 400 200 385 200 370 Z" fill="url(#amber)"/>
    
    <!-- Inner liquid highlight -->
    <path d="M 208 215 L 292 215 L 292 365 C 292 375 282 385 272 385 L 228 385 C 218 385 208 375 208 365 Z" fill="#ffb703" opacity="0.15"/>
    
    <!-- Gold Premium Label -->
    <rect x="215" y="240" width="70" height="100" rx="5" fill="url(#gold)"/>
    <rect x="220" y="245" width="60" height="90" rx="3" fill="#0f3a22"/>
    
    <!-- Label Details -->
    <line x1="235" y1="265" x2="265" y2="265" stroke="url(#gold)" stroke-width="2"/>
    <line x1="240" y1="275" x2="260" y2="275" stroke="url(#gold)" stroke-width="1"/>
    <circle cx="250" cy="300" r="10" fill="url(#gold)"/>
    <path d="M 246 300 A 4 4 0 0 1 254 300" fill="none" stroke="#0f3a22" stroke-width="1.5"/>
  </g>
</svg>
