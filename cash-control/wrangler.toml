# Cash Control — wrangler config (run commands from project root)
# See README.md for full setup

name = "cash-control"
main = "backend/worker-api.js"
compatibility_date = "2024-11-01"

[assets]
directory = "frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cash-control-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
OWNER_PIN = "CHANGE_ME_OWNER"
WORKER_PIN = "CHANGE_ME_WORKER"
