# Cash Control — wrangler config (run commands from project root)
# See README.md for full setup

name = "cash-control"
main = "backend/worker-api.js"
compatibility_date = "2024-11-01"

[assets]
directory = "frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cash-control-db"
database_id = "7d58e703-460b-4729-8058-21b10a9c2d77"

[vars]
OWNER_PIN = "1111"
WORKER_PIN = "1111"
