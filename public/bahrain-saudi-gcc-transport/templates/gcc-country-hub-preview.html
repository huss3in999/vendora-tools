<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}site.css">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}assets/vendora-theme.css">
  <script type="application/ld+json">{{SCHEMA_JSON}}</script>
</head>
<body class="home-premium vip-transport" data-private-preview="true" data-country-code="{{COUNTRY_CODE}}">
  <header class="topbar"><div class="container nav"><span class="brand"><span class="brand-copy"><span class="brand-title">Vendora Transport</span><span class="brand-sub">{{BRAND_SUBTITLE}}</span></span></span><span class="keyword-chip">{{PREVIEW_LABEL}}</span></div></header>
  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy glass"><span class="eyebrow"><strong>{{ACTIVE_ONLY_LABEL}}</strong></span><h1>{{HEADING}}</h1><p class="lead">{{INTRO}}</p></div>
        <aside class="hero-side glass"><h2>{{POLICY_HEADING}}</h2><p>{{POLICY_COPY}}</p></aside>
      </div>
    </section>
    <section class="section">
      <div class="container section-shell">
        <div class="section-head"><h2>{{ROUTES_HEADING}}</h2><p>{{ROUTES_COPY}}</p></div>
        <div class="route-grid">{{ROUTE_CARDS}}</div>
        {{EMPTY_STATE}}
      </div>
    </section>
    <section class="section">
      <div class="container section-shell">
        <div class="section-head"><h2>{{PICKUP_HEADING}}</h2></div>
        <ul>{{PICKUP_ITEMS}}</ul>
      </div>
    </section>
  </main>
</body>
</html>
