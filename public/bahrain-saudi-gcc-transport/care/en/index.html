<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Passenger Care | GCC Transport</title>
  <link rel="stylesheet" href="../care.css">
  <meta name="description" content="Private page for following up a confirmed transport request and submitting journey feedback.">
  <!-- Vendora global sources: edit config/*.json and assets/vendora-theme.css, then run npm run sync. -->
  <link rel="stylesheet" href="../../assets/vendora-theme.css" data-vendora-global-theme />
  <script src="../../assets/vendora-config.js" data-vendora-global-config></script>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <strong>GCC Transport</strong><br>
        <span class="muted">Passenger Care</span>
      </div>
    </div>

    <div class="card">
      <div id="loadingView" class="status">
        <p id="loadingText" class="muted">Loading your booking…</p>
      </div>

      <div id="errorView" class="status hidden">
        <p id="errorBody" class="error"></p>
      </div>

      <div id="lockedView" class="locked hidden">
        <h2 id="lockedTitle">Follow-up already submitted</h2>
        <p id="lockedBody" class="muted"></p>
      </div>

      <div id="thanksView" class="thanks hidden">
        <h2 id="thanksTitle">Thank You</h2>
        <p id="thanksBody" class="lead"></p>
        <p id="thanksSub" class="lead"></p>
        <p id="thanksFooter" class="muted"></p>
      </div>

      <div id="formView" class="hidden">
        <h1>Journey Follow-Up</h1>
        <p id="trustLead" class="lead"></p>
        <div class="ref">Booking Ref: <strong id="refLabel"></strong></div>
        <p id="routeLabel" class="route hidden"></p>

        <p id="questionText" class="question"></p>
        <div id="outcomeOptions" class="options"></div>

        <details class="optional" open>
          <summary id="optionalSummary"></summary>
          <div class="field">
            <label id="ratingLabel">Service rating</label>
            <div id="ratingRow" class="rating-row"></div>
          </div>
          <div class="field">
            <label id="commentLabel" for="commentField">Comment</label>
            <textarea id="commentField" maxlength="1000"></textarea>
          </div>
          <div class="field">
            <label id="quotedLabel" for="quotedField">Quoted price (optional)</label>
            <input id="quotedField" type="number" min="0" step="0.001" inputmode="decimal">
          </div>
          <div class="field">
            <label id="paidLabel" for="paidField">Paid price (optional)</label>
            <input id="paidField" type="number" min="0" step="0.001" inputmode="decimal">
          </div>
        </details>

        <p id="formError" class="error"></p>
        <button id="submitBtn" class="submit" type="button" disabled></button>
      </div>
    </div>

    <p id="footerNote" class="footer-note"></p>
  </div>
  <script src="../care.js?v=20260605-care3"></script>
</body>
</html>
