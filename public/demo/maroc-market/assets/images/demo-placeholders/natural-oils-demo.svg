<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf6eb"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a3e3d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Dropper Top -->
    <path d="M 240 180 L 260 180 L 255 140 L 245 140 Z" fill="#eee"/>
    <rect x="235" y="180" width="30" height="10" rx="2" fill="url(#gold)"/>
    
    <!-- Bottle Neck -->
    <rect x="242" y="190" width="16" height="15" fill="#fff" opacity="0.6"/>
    
    <!-- Bottle Body (Amber Glass) -->
    <path d="M 215 210 C 215 200 225 200 230 200 L 270 200 C 275 200 285 200 285 210 L 285 330 C 285 340 275 350 260 350 L 240 350 C 225 350 215 340 215 330 Z" fill="url(#amber)"/>
    
    <!-- Gold Label -->
    <rect x="225" y="240" width="50" height="70" rx="3" fill="url(#gold)"/>
    <rect x="228" y="243" width="44" height="64" rx="2" fill="#0f3a22"/>
    
    <!-- Label droplet -->
    <path d="M 250 265 Q 250 265 242 278 A 8 8 0 0 0 258 278 Q 250 265 250 265 Z" fill="url(#gold)"/>
  </g>
</svg>
