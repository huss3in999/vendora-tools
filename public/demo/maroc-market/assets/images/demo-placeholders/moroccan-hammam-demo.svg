<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf5ec"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a3e3d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Hammam Glove (Kessa) & Soap Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Kessa Glove Shape (Dark Charcoal/Brown textured hand glove silhouette) -->
    <path d="M 210 210 C 210 190 230 180 250 180 C 270 180 290 190 290 210 L 300 310 C 300 325 290 330 270 330 L 210 330 C 190 330 180 325 180 310 Z" fill="#3a302e"/>
    <!-- Glove Cuff (Gold border) -->
    <path d="M 180 310 L 300 310 L 300 322 L 180 322 Z" fill="url(#gold)"/>
    <!-- Hanging loop on cuff -->
    <path d="M 240 322 Q 250 340 260 322" fill="none" stroke="url(#gold)" stroke-width="3"/>

    <!-- Small Soap Clay Smear beside glove -->
    <path d="M 290 290 Q 320 280 310 310 Q 285 305 290 290 Z" fill="#8c8b38" opacity="0.95"/>
    <ellipse cx="302" cy="298" rx="3" ry="1.5" fill="#dec8ac" opacity="0.5"/>
  </g>
</svg>
