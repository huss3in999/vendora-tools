<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5ec"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a3e3d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Botanical leaves -->
  <path d="M 150 200 Q 110 160 140 120 Q 180 140 150 200 Z" fill="#0f3a22" opacity="0.12"/>
  <path d="M 330 200 Q 370 160 340 120 Q 300 140 330 200 Z" fill="#0f3a22" opacity="0.12"/>

  <!-- Mortar and Pestle Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Mortar Bowl -->
    <path d="M 170 260 C 170 240 330 240 330 260 C 330 315 295 330 250 330 C 205 330 170 315 170 260 Z" fill="url(#gold)"/>
    <path d="M 170 260 C 170 270 330 270 330 260" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
    <ellipse cx="250" cy="258" rx="75" ry="10" fill="#8a6c3f" opacity="0.6"/>

    <!-- Pestle -->
    <path d="M 280 180 L 305 195 L 245 285 L 220 270 Z" fill="#cda87e"/>
    <path d="M 280 180 L 305 195 L 315 185 L 290 170 Z" fill="url(#gold)"/>
    
    <!-- Leaves sticking out of mortar -->
    <path d="M 210 250 Q 180 210 210 190 Q 230 220 210 250 Z" fill="#0f3a22" opacity="0.85"/>
  </g>
</svg>
