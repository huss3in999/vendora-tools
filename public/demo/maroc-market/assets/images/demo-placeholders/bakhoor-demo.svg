<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffefe"/>
      <stop offset="100%" stop-color="#eae0d5"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5b4"/>
      <stop offset="40%" stop-color="#dec8ac"/>
      <stop offset="70%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <linearGradient id="charcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a302e"/>
      <stop offset="100%" stop-color="#140f0e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4a3e3d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <path d="M 120 450 L 120 220 A 130 130 0 0 1 380 220 L 380 450" fill="none" stroke="#dec8ac" stroke-width="1" opacity="0.3"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="405" rx="90" ry="15" fill="#dec8ac" opacity="0.5"/>

  <!-- Smoke curls -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity="0.45" filter="url(#shadow)">
    <!-- Smoke line 1 -->
    <path d="M 230 200 Q 180 130 230 90 T 210 30" stroke-width="8"/>
    <!-- Smoke line 2 -->
    <path d="M 270 200 Q 320 140 270 100 T 290 40" stroke-width="6"/>
  </g>

  <!-- Bakhoor burner (Mabkhara) -->
  <g filter="url(#shadow)">
    <!-- Base stand -->
    <path d="M 200 390 L 300 390 L 320 410 L 180 410 Z" fill="url(#gold)"/>
    
    <!-- Central Pillar -->
    <path d="M 230 390 L 270 390 L 265 300 L 235 300 Z" fill="url(#gold)"/>
    <!-- Pillar details -->
    <line x1="233" y1="340" x2="267" y2="340" stroke="#8a6c3f" stroke-width="2"/>

    <!-- Main Burner Cup -->
    <path d="M 220 300 L 280 300 L 310 230 L 190 230 Z" fill="url(#gold)"/>
    
    <!-- Star cutouts inside Mabkhara -->
    <path d="M 250 250 L 253 258 L 262 258 L 255 263 L 258 272 L 250 266 L 242 272 L 245 263 L 238 258 L 247 258 Z" fill="#2d221e" opacity="0.85"/>
    
    <!-- Glowing Charcoal inside the cup rim -->
    <path d="M 200 230 C 200 220 300 220 300 230 Z" fill="url(#charcoal)"/>
    <!-- Red glowing ember -->
    <ellipse cx="250" cy="227" rx="20" ry="5" fill="#ff4d00" opacity="0.85" filter="url(#shadow)"/>
    <ellipse cx="250" cy="227" rx="8" ry="2.5" fill="#ffea00" opacity="0.9"/>
  </g>
</svg>
