<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faeadf"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a3e3d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Leaf background element -->
  <path d="M 330 380 Q 380 300 310 240 Q 240 320 330 380 Z" fill="#0f3a22" opacity="0.06"/>

  <!-- Cream Jar Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Jar Body (Creamy White glass) -->
    <path d="M 180 240 L 320 240 C 335 240 340 250 340 260 L 340 320 C 340 335 330 340 315 340 L 185 340 C 170 340 160 335 160 320 L 160 260 C 160 250 165 240 180 240 Z" fill="#fff" opacity="0.9"/>
    
    <!-- Jar Lid (Gold) -->
    <path d="M 170 215 C 170 205 330 205 330 215 L 330 235 C 330 240 170 240 170 235 Z" fill="url(#gold)"/>

    <!-- Green Leaf motif on jar -->
    <path d="M 250 305 Q 235 285 250 265 Q 265 285 250 305 Z" fill="#0f3a22" opacity="0.7"/>
    <circle cx="250" cy="285" r="2" fill="url(#gold)"/>
  </g>
</svg>
