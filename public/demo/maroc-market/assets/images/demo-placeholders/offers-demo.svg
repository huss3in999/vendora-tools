<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faeadf"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#b22b2f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#b22b2f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Sale Percent Badge Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Red scalloped ribbon base or round seal -->
    <circle cx="250" cy="250" r="90" fill="url(#redGrad)"/>
    <circle cx="250" cy="250" r="82" fill="none" stroke="url(#gold)" stroke-dasharray="8 6" stroke-width="2"/>
    
    <!-- Percent sign in Arabic/English style (%) -->
    <text x="250" y="275" font-family="'Outfit', 'Inter', 'Arial', sans-serif" font-size="78" font-weight="900" fill="url(#gold)" text-anchor="middle">%</text>
  </g>
</svg>
