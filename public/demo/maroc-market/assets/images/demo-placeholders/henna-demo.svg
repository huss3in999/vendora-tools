<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f2ebe0"/>
    </radialGradient>
    <linearGradient id="hennaGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#556b2f"/>
      <stop offset="60%" stop-color="#3b4d1c"/>
      <stop offset="100%" stop-color="#24330d"/>
    </linearGradient>
    <linearGradient id="bowlColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#a3704c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8ac"/>
      <stop offset="50%" stop-color="#cda87e"/>
      <stop offset="100%" stop-color="#b6905d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#4a3e3d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  
  <path d="M 100 450 L 100 200 A 150 150 0 0 1 400 200 L 400 450" fill="none" stroke="#dec8ac" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Shadow -->
  <ellipse cx="250" cy="385" rx="120" ry="22" fill="#dec8ac" opacity="0.5"/>

  <!-- Henna Leaves on ground -->
  <g fill="#3b4d1c" opacity="0.25">
    <!-- Leaf 1 -->
    <path d="M 120 370 Q 90 350 120 330 Q 150 350 120 370 Z"/>
    <!-- Leaf 2 -->
    <path d="M 380 370 Q 410 350 380 330 Q 350 350 380 370 Z"/>
  </g>

  <!-- Bowl with Henna Powder -->
  <g filter="url(#shadow)">
    <!-- Henna Powder Pile -->
    <path d="M 180 300 Q 250 240 320 300 Z" fill="url(#hennaGreen)"/>
    <ellipse cx="250" cy="298" rx="72" ry="12" fill="url(#hennaGreen)"/>
    <!-- Light Green highlight on powder top -->
    <path d="M 220 280 Q 250 250 280 280 Z" fill="#6b8e23" opacity="0.25"/>

    <!-- Bowl Body -->
    <path d="M 140 300 C 140 280 360 280 360 300 C 360 355 310 380 250 380 C 190 380 140 355 140 300 Z" fill="url(#bowlColor)"/>
    <path d="M 140 300 C 140 312 360 312 360 300" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.15"/>
    
    <!-- Gold pattern line -->
    <path d="M 160 330 Q 250 345 340 330" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
